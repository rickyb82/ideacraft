[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/rickyb82/ideacraft"

[workspace.dependencies]
ideacraft-core = { path = "crates/core", version = "0.1.0" }
ideacraft-formats = { path = "crates/formats", version = "0.1.0" }
ideacraft-engine = { path = "crates/engine", version = "0.1.0" }
ideacraft-ui-egui = { path = "crates/ui-egui", version = "0.1.0" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
rfd = "0.17"
sys-locale = "0.3"

egui = "0.36"
eframe = { version = "0.36", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
